{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Users</h1>
  <a class="btn btn-primary" href="{{ url_for('users.new_user') }}">+ New user</a>
</div>

<div class="card p-3">
  <table class="table align-middle mb-0">
    <thead><tr><th>Username</th><th>Role</th><th></th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.username }}</td>
        <td><span class="badge bg-secondary">{{ user.role }}</span></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users.edit_user', user_id=user.id) }}">Edit</a>
          {% if user.id != current_user.id %}
          <form method="post" action="{{ url_for('users.delete_user', user_id=user.id) }}" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
          </form>
          {% endif %}
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="text-muted text-center py-4">No users yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

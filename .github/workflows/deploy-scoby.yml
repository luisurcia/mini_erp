name: CI Scoby

on:
  push:
    branches: [client/scoby]
  pull_request:
    branches: [client/scoby]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest --cov=app --cov-report=term-missing

  deploy:
    name: Deploy Scoby ERP to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/client/scoby'
    runs-on: ubuntu-latest
    environment: scoby-production
    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 21098 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Same cPanel account/server as kombuchaerp (see ci.yml), just a
      # second, independent "Python App" at ~/scobyerp on the
      # client/scoby branch — its own virtualenv, its own SQLite
      # database, its own env vars. Reuses the same repo-level SSH
      # secrets (SSH_HOST/SSH_USER/SSH_PRIVATE_KEY) since it's the same
      # server/account — no separate deploy key needed. See README.md ->
      # Deployment -> Scoby ERP for the one-time setup this assumes is
      # already done, and for the manual version of these same steps.
      - name: Deploy over SSH (backup, pull, dependencies, schema, restart)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p 21098 -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/scobyerp

            KOMBUCHAERP_APP_DIR="$HOME/scobyerp" \
            KOMBUCHAERP_DB_PATH="$HOME/scobyerp/instance/mini_erp.db" \
            KOMBUCHAERP_BACKUP_DIR="$HOME/backups/scobyerp" \
              ~/scobyerp/deploy/backup_sqlite.sh

            git pull --ff-only origin client/scoby

            cloudlinux-selector install-modules --json --interpreter python \
              --user "$(whoami)" --app-root "$HOME/scobyerp" \
              --requirements-file requirements.txt

            source ~/virtualenv/scobyerp/3.12/bin/activate
            export FLASK_APP=wsgi.py
            flask init-db

            cloudlinux-selector restart --json --interpreter python \
              --user "$(whoami)" --app-root "$HOME/scobyerp"
          '

      - name: Verify /scobyerp/health after restart
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" https://titourcia.com/scobyerp/health)
          echo "health check status: $status"
          if [ "$status" != "200" ]; then
            echo "Deploy restarted the service but /scobyerp/health did not return 200."
            exit 1
          fi
